name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          java -version

      - name: Build unsigned IPA
        run: |
          chmod +x gradlew
          ./gradlew :ios:createIPA \
            -ProbovmVersion=2.3.23 \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: KPAH-iOS-unsigned
          path: ios/build/robovm/**/*.ipa
          if-no-files-found: error
          retention-days: 7
