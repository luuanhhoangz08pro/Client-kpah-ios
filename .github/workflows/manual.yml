name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ci/ipa-9f06642

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: 9f06642290a4fcd19ee700ee0ef4d67101d7434f
          persist-credentials: false

      - name: Verify source commit
        run: |
          test "$(git rev-parse HEAD)" = "9f06642290a4fcd19ee700ee0ef4d67101d7434f"
          git log -1 --format='%H %s'

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          java -version

      - name: Build unsigned IPA
        run: |
          chmod +x gradlew
          ./gradlew :ios:createIPA \
            -ProbovmVersion=2.3.23 \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: KPAH-iOS-9f06642-unsigned
          path: ios/build/robovm/**/*.ipa
          if-no-files-found: error
          retention-days: 7
